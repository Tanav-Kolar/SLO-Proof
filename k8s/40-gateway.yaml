# gatewayClassName is substituted at deploy time. On EKS this is the class
# installed by the AWS Load Balancer Controller (Gateway API support, controller
# 2.14.0+), which provisions the ALB. Verify the controller release supports
# Gateway API before relying on it.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: checkout-gateway
  namespace: checkout
  labels: { app.kubernetes.io/part-of: sloproof }
spec:
  gatewayClassName: __GATEWAY_CLASS_NAME__
  # Envoy Gateway renders these onto the Service it generates for this Gateway,
  # which is what actually selects the AWS load balancer type. Setting the same
  # annotation as a helm value does NOT work: the chart stores it but the
  # controller never applies it to the Service, and AWS then falls back to a
  # classic ELB with no error anywhere.
  infrastructure:
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-type: nlb
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces: { from: Same }
